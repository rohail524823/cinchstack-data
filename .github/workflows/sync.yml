name: Sync from cinchstack.com
on:
  schedule:
    - cron: '23 6 * * *'   # daily, 06:23 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download the dataset and rebuild the README
        run: python3 scripts/sync.py
      - name: Keep the daily schedule alive
        # GitHub pauses scheduled workflows after 60 days without a commit, so when the data has
        # not changed for 45 days, record the date of this check instead.
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then date -u +%F > .last-sync; fi
          fi
      - name: Commit any change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'Nothing changed.'; exit 0; fi
          checked=$(python3 -c "import json; print(json.load(open('pricing.json'))['lastChecked'])")
          git commit -m "Sync from cinchstack.com/data/ (last checked $checked)"
          git push
